name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Placeholder so the build step (which reads it via next.config.ts /
      # process.env at build time) doesn't fail on a missing var - CI never
      # talks to a real backend, it only needs the app to compile.
      NEXT_PUBLIC_API_URL: https://example.invalid
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # npm 10.x (whatever setup-node's Node 24 currently bundles) fails
      # `npm ci` on this lockfile - "Missing @emnapi/... from lock file" -
      # over an optional-dependency subtree (sharp's wasm32 fallback build
      # pulling in the same @emnapi packages other optional native modules
      # need at different versions). Confirmed by direct comparison: the
      # exact same lockfile installs and `ci`s cleanly under npm 11, fails
      # under npm 10, regardless of Node version either was run under - an
      # npm-version bug/incompatibility, not a lockfile or Node problem.
      # Pinning npm explicitly here is more reliable than hoping whatever
      # Node 24 patch the runner has today still bundles a working npm.
      - run: npm install -g npm@11

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      # Also the type check - Next's build already runs a full TypeScript
      # pass internally, and doing it here (not as a separate `tsc --noEmit`
      # step) matters: a standalone tsc run on a fresh checkout fails, since
      # `LayoutProps` and friends are declared in .next/types/*.d.ts, which
      # only exists once a build (or `next dev`) has generated it - .next/
      # is gitignored, so a clean checkout never has it yet.
      - name: Build (includes type check)
        run: npm run build
